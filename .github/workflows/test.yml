name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Run bats unit tests
        run: bats tests/unit/run.bats

  run-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Run a workflow
        id: r
        uses: ./
        with:
          workflow: tests/fixtures/test.orchstep.yml
      - name: Assert exit code 0
        shell: bash
        run: test "${{ steps.r.outputs.exit-code }}" = "0"

  run-with-vars:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run with vars
        id: r
        uses: ./
        with:
          workflow: tests/fixtures/test.orchstep.yml
          task: greet
          vars: |
            name=ci
      - name: Assert the greet task ran with the var
        shell: bash
        run: |
          test "${{ steps.r.outputs.exit-code }}" = "0"
          echo "${{ steps.r.outputs.summary }}" | grep -q "hello ci"

  fail-on-error-false:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run a nonexistent task without failing the job
        id: soft
        uses: ./
        with:
          workflow: tests/fixtures/test.orchstep.yml
          task: this-task-does-not-exist
          fail-on-error: 'false'
      - name: Assert the step recorded a nonzero exit code
        shell: bash
        run: test "${{ steps.soft.outputs.exit-code }}" != "0"
