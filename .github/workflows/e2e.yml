name: e2e

on:
  push:
    branches: [main]
  # Run on demand — the orchstep-release skill dispatches this after each release
  # to validate the published run-orchstep action end-to-end. No daily cron:
  # what's under test only changes at release time.
  workflow_dispatch:

jobs:
  run-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the run-with-vars example
        uses: ./
        with:
          workflow: orchstep.yml
          working-directory: examples/run-with-vars
          vars: |
            greeting=hello-from-e2e

  lint-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint the example workflow
        uses: ./
        with:
          command: lint
          workflow: orchstep.yml
          working-directory: examples/lint-on-pr
